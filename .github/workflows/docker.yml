# Builds the image on every push, starts it, and checks the public pages
# answer. On master it also pushes the image to the GitHub Container
# Registry (ghcr.io/<owner>/counterplay), where a new package starts PRIVATE.
#
# Production does not pull this image; it is the staging copy's
# (deploy/docker-compose.yml, deploy/STAGING.md).
name: docker

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t counterplay:ci .

      - name: Start it and check it answers
        run: |
          docker run -d --name cp -p 8000:8000 counterplay:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 2
          done
          for path in / /sample-report /signup /login /privacy /terms; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$code $path"
            [ "$code" = 200 ] || { docker logs cp; exit 1; }
          done
          # The parse worker starts from the same image.
          docker run --rm counterplay:ci python -c "import app.worker, app.coach, demoparser2, lightgbm"

      - name: Push to GHCR
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for tag in latest "${GITHUB_SHA::12}"; do
            docker tag counterplay:ci "ghcr.io/$owner/counterplay:$tag"
            docker push "ghcr.io/$owner/counterplay:$tag"
          done
