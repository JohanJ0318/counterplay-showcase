# Runs on every push. Needs no demo file, no database and no secrets: the
# parser tests read whatever parsed output is present and skip cleanly when
# there is none.
#
# The slower check — re-parsing real demos and asserting known-good round
# counts — needs the corpus, which is deliberately not in this repository.
# Run `pytest tests/` locally against your own database before deploying.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q
